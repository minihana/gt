<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資優班成績單質性評語產生器 v5</title>
    <style>
        :root {
            --primary-color: #5b7065;
            --secondary-color: #c9d6cd;
            --accent-color: #df9f9f;
            --bg-color: #f7f9f8;
            --card-bg: #ffffff;
            --text-color: #3a4740;
            --border-color: #e2e8e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 30px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), #7a8f83);
            color: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 16px;
            color: var(--primary-color);
            margin-bottom: 16px;
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5750;
        }

        .trait-category {
            margin-bottom: 15px;
            border-bottom: 1px dashed #e2e8e5;
            padding-bottom: 12px;
        }
        .trait-category:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .category-title {
            font-size: 13px;
            color: #72857a;
            font-weight: bold;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafbfa;
            color: var(--text-color);
            font-size: 14px;
            resize: vertical;
        }

        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .input-cell {
            flex: 1;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafbfa;
            font-size: 14px;
            color: var(--text-color);
        }

        .characteristic-tags {
            margin-top: 5px;
        }

        .tag-checkbox {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 8px;
            font-size: 12.5px;
            background: #f0f2f1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none;
        }

        .tag-checkbox input {
            margin-right: 5px;
        }

        .tag-checkbox.active {
            background-color: #e3ece8;
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #4a5c53;
        }

        .btn-secondary {
            background-color: #7a8f83;
            margin-top: 8px;
        }

        .btn-orange {
            background-color: #cca47c;
            margin-top: 10px;
        }
        .btn-orange:hover {
            background-color: #b58f68;
        }

        .btn-collapse {
            background-color: #eef2f0;
            color: var(--primary-color);
            border: 1px solid var(--secondary-color);
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            width: auto;
            display: inline-block;
            margin-bottom: 10px;
        }
        .btn-collapse.active {
            background-color: var(--secondary-color);
            color: #2e3b33;
        }

        .collapse-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .result-section {
            background-color: #f0f4f2;
            border: 1px dashed var(--primary-color);
        }

        .result-box {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-top: 12px;
            font-size: 14px;
            white-space: pre-wrap;
            color: #2e3b33;
            max-height: 280px;
            overflow-y: auto;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 13px;
        }

        .log-table th, .log-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .log-table th {
            background-color: #eef2f0;
            color: var(--primary-color);
            text-align: left;
        }

        .copy-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }

        .copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .step-num {
            display: inline-block;
            width: 22px;
            height: 22px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 12px;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>資優班成績單評語優化產生器 v5 (多樣化刷詞版) 🌸</h1>
        <p>新增隨機全新描述功能，一鍵換句話說不撞詞！後台歷史紀錄支援收折，排版更清爽</p>
    </header>

    <div class="card">
        <h2><span><span class="step-num">1</span>步驟一：歷史評語風格庫分析</span></h2>
        <div class="form-group">
            <label for="historyInput">貼上您過去親自撰寫的評語範例（可持續累積）：</label>
            <textarea id="historyInput" placeholder="在此貼上您以前寫的個別化評語，系統會自動在本地瀏覽器後台分析並留存您的語調特徵..."></textarea>
            <button class="btn btn-secondary" style="width: auto; padding: 6px 16px; font-size: 13px;" onclick="analyzeAndLogStyle()">📥 分析語調風格並記錄至後台</button>
        </div>
        <div>
            <button class="btn-collapse" id="collapseBtn" onclick="toggleCollapse()">📁 點擊展開/收折已儲存的筆調特徵 (預設隱藏)</button>
            <div class="collapse-content" id="collapseContent">
                <div style="overflow-x: auto; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; background-color: #fafbfa;">
                    <table class="log-table" id="logTable">
                        <thead>
                            <tr>
                                <th style="width: 20%;">分析時間</th>
                                <th style="width: 50%;">原評語片段摘要</th>
                                <th style="width: 30%;">系統提取之筆調特徵</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2><span><span class="step-num">2</span>步驟二：內建 PROMPT 限制與大綱設定</span></h2>
        <div class="form-group">
            <label>📋 內建寫作核心限制（預設已啟用）：</label>
            <div class="characteristic-tags">
                <label class="tag-checkbox active"><input type="checkbox" id="p_style" checked value="嚴格禁止使用任何公式化、對仗式排比（例如：絕對不能出現「不僅...更是...」、「不僅在...更在...」等生硬死板的句型），請使用流暢自然的敘事散文筆調。"> ❌ 禁用生硬公式對仗</label>
                <label class="tag-checkbox active"><input type="checkbox" id="p_tone" checked value="文字語調需流暢自然、充滿實地教學觀察的溫度，貼近臺灣教育現場的日常口吻。"> ❤️ 溫暖自然臺灣口吻</label>
                <label class="tag-checkbox active"><input type="checkbox" id="p_focus" checked value="著重記錄孩子在專題探究或小組互助中，面對瓶頸時的心理調適、批判性思考與同儕真實互動。"> 🧠 著重內在調適與互動</label>
            </div>
        </div>
        <div class="form-group">
            <label for="syllabusInput">本學期課程大綱、學習目標或專題核心內容（如：獨立研究架構、PBL社區文史走讀、環境素養課程）：</label>
            <textarea id="syllabusInput" placeholder="請輸入本期課程內容..."></textarea>
        </div>
    </div>

    <div class="card">
        <h2><span><span class="step-num">3</span>步驟三：選填學生基本資料與資優特質表現</span></h2>
        
        <div class="input-row">
            <div class="input-cell
