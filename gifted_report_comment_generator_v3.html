<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資優班成績單質性評語產生器 v4</title>
    <style>
        :root {
            --primary-color: #5b7065;
            --secondary-color: #c9d6cd;
            --accent-color: #df9f9f;
            --bg-color: #f7f9f8;
            --card-bg: #ffffff;
            --text-color: #3a4740;
            --border-color: #e2e8e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 30px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), #7a8f83);
            color: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 16px;
            color: var(--primary-color);
            margin-bottom: 16px;
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5750;
        }

        .trait-category {
            margin-bottom: 15px;
            border-bottom: 1px dashed #e2e8e5;
            padding-bottom: 12px;
        }
        .trait-category:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .category-title {
            font-size: 13px;
            color: #72857a;
            font-weight: bold;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafbfa;
            color: var(--text-color);
            font-size: 14px;
            resize: vertical;
        }

        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .input-cell {
            flex: 1;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafbfa;
            font-size: 14px;
            color: var(--text-color);
        }

        .characteristic-tags {
            margin-top: 5px;
        }

        .tag-checkbox {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 8px;
            font-size: 12.5px;
            background: #f0f2f1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none;
        }

        .tag-checkbox input {
            margin-right: 5px;
        }

        .tag-checkbox.active {
            background-color: #e3ece8;
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #4a5c53;
        }

        .btn-secondary {
            background-color: #7a8f83;
            margin-top: 8px;
        }

        .result-section {
            background-color: #f0f4f2;
            border: 1px dashed var(--primary-color);
        }

        .result-box {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-top: 12px;
            font-size: 14px;
            white-space: pre-wrap;
            color: #2e3b33;
            max-height: 280px;
            overflow-y: auto;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }

        .log-table th, .log-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .log-table th {
            background-color: #eef2f0;
            color: var(--primary-color);
        }

        .copy-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }

        .copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .step-num {
            display: inline-block;
            width: 22px;
            height: 22px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 12px;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>資優班成績單評語優化產生器 v4 (動態區分度升級版) 🌸</h1>
        <p>徹底告別套版感！針對每位資優生不同的特質與軼事組合，動態編織專屬質性評語</p>
    </header>

    <div class="card">
        <h2><span><span class="step-num">1</span>步驟一：歷史評語風格庫分析</span></h2>
        <div class="form-group">
            <label for="historyInput">貼上您過去親自撰寫的評語範例（可持續累積）：</label>
            <textarea id="historyInput" placeholder="在此貼上您以前寫的個別化評語，系統會自動在本地瀏覽器後台分析並留存您的語調特徵..."></textarea>
            <button class="btn btn-secondary" style="width: auto; padding: 6px 16px; font-size: 13px;" onclick="analyzeAndLogStyle()">📥 分析語調風格並記錄至後台</button>
        </div>
        <div>
            <label>📊 本地後台已儲存的筆調特徵：</label>
            <div style="overflow-x: auto;">
                <table class="log-table" id="logTable">
                    <thead>
                        <tr>
                            <th style="width: 15%;">分析時間</th>
                            <th style="width: 55%;">原評語片段摘要</th>
                            <th style="width: 30%;">系統提取之筆調特徵</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card">
        <h2><span><span class="step-num">2</span>步驟二：內建 PROMPT 限制與大綱設定</span></h2>
        <div class="form-group">
            <label>📋 內建寫作核心限制（預設已啟用）：</label>
            <div class="characteristic-tags">
                <label class="tag-checkbox active"><input type="checkbox" id="p_style" checked value="嚴格禁止使用任何公式化、對仗式排比（例如：絕對不能出現「不僅...更是...」、「不僅在...更在...」等生硬死板的句型），請使用流暢自然的敘事散文筆調。"> ❌ 禁用生硬公式對仗</label>
                <label class="tag-checkbox active"><input type="checkbox" id="p_tone" checked value="文字語調需流暢自然、充滿實地教學觀察的溫度，貼近臺灣教育現場的日常口吻。"> ❤️ 溫暖自然臺灣口吻</label>
                <label class="tag-checkbox active"><input type="checkbox" id="p_focus" checked value="著重記錄孩子在專題探究或小組互助中，面對瓶頸時的心理調適、批判性思考與同儕真實互動。"> 🧠 著重內在調適與互動</label>
            </div>
        </div>
        <div class="form-group">
            <label for="syllabusInput">本學期課程大綱、學習目標或專題核心內容（如：獨立研究架構、PBL社區文史走讀、環境素養課程）：</label>
            <textarea id="syllabusInput" placeholder="請輸入本期課程內容..."></textarea>
        </div>
    </div>

    <div class="card">
        <h2><span><span class="step-num">3</span>步驟三：選填學生基本資料與資優特質表現</span></h2>
        
        <div class="input-row">
            <div class="input-cell">
                <label for="studName">學生姓名</label>
                <input type="text" id="studName" placeholder="例如：小薰">
            </div>
            <div class="input-cell">
                <label for="studGrade">年級</label>
                <select id="studGrade">
                    <option value="三年級">三年級</option>
                    <option value="四年級">四年級</option>
                    <option value="五年級">五年級</option>
                    <option value="六年級">六年級</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>🧬 國小資優生課堂學習表現樣貌（請依孩子實際狀況勾選，每次組合不同，產出內容將大相逕庭）：</label>
            
            <div class="trait-category">
                <div class="category-title">💡 認知思考與探究特質</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="cog" data-text="在面對探究主題時，擁有極其細緻敏銳的觀察觸角，能自發捕捉到一般同儕容易忽略的微小變化與變因" value="觀察力極為敏銳細緻，擅長捕捉一般同儕忽略的微小變化或變因"> 🔍 觀察敏銳細緻</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="cog" data-text="展現出高度的自主探究熱忱，遇到盲點時會自發性地翻閱相關文獻、尋求各種數位資源來自我解惑" value="具高度自主探究熱忱，會自發性翻閱文獻、尋找數位資源解決疑惑"> 🚀 獨立自主探究</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="cog" data-text="其思維敏捷且充滿跨領域的聯結力，非常擅長將不同學科的概念進行結構化的整合" value="思維敏捷跳躍，概念聯結力強，能跨領域整合不同學科的知識"> 🧩 跨領域聯結力強</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="cog" data-text="擁有打破砂鍋問到底的強烈內在動機，對於自己感興趣的主題會投入超乎常人的求知熱情" value="求知欲與打破砂鍋問到底的傾向強烈，對於感興趣的主題具有高度內在動機"> 🎯 強烈內在求知欲</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="cog" data-text="具備不落俗套的擴散性思考特質，在腦力激盪時常能拋出令人驚豔的創新思維觀點" value="思維不落俗套，具擴散性思考特質，常能拋出令人驚豔的創新觀點"> 💡 創意思維擴散</label>
                </div>
            </div>

            <div class="trait-category">
                <div class="category-title">⚖️ 學習歷程與盲點調適（情意/非認知層面）</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="adj" data-text="然而在情意層面上存在較為明顯的完美主義傾向，當實驗數據或探究進度未達預期時，神情偶爾會流露出些許急躁與挫折感" value="具高度完美主義傾向，當數據、實驗或探究進度不符預期時，神情偶爾會顯得有些急躁"> ⚠️ 挫折容忍度待引導</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="adj" data-text="雖然課堂實作的執行力極高且動作迅速，不過在期末將歷程轉化為書面成果時，整體的文字深度與收尾論述則顯得有些急促" value="實作與執行力極高、動作迅速，但期末成果報告的文字深度與收尾論述稍顯急促"> ✍️ 文字收尾深度待提煉</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="adj" data-text="一旦投入熱愛的研究主題便極度專注，但有時會不自覺地過度執著於非核心的枝微末節，需要適時引導其跳脫出來看大局" value="專注力極高，一旦投入熱愛的研究主題便欲罷不能，但有時會過度執著於非核心細節"> 🎯 過度執著於細節</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="adj" data-text="在面對缺乏難度或過於常規的課堂任務時，容易出現隱性的注意力渙散，對於高度挑戰性任務的耐受度反而更高" value="當課堂任務缺乏挑戰性時，易出現注意力渙散或失去耐心的隱性學習樣貌"> 🥱 缺乏挑戰時易渙散</label>
                </div>
            </div>

            <div class="trait-category">
                <div class="category-title">🤝 領導力、情意特質與同儕互動</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="soc" data-text="在課堂互動中非常樂於與夥伴分享，並能用充滿溫暖且具有建設性的視角進行深刻的同儕互評與回饋" value="樂於與同儕分享觀點，並能用溫暖、具建設性的視角進行深刻的同儕互評與回饋"> 💬 善於建設性互評</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="soc" data-text="在小組合作中能展現正向的領導特質，擅長有效統整同儕之間紛歧的意見並穩健推動任務進度" value="在小組專題中展現強烈正向領導力，擅長統整同儕意見並推動討論任務"> 👑 小組正向引領領導</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="soc" data-text="心思細膩且情意感官敏銳，對於週遭的環境生態或文史議題，抱持著極高的同理心與內省能力" value="情意感官敏銳，對環境生態、社會文史或弱勢議題具備高度的同理心與反思能力"> 🌱 具高度人文生態同理</label>
                    <label class="tag-checkbox" onclick="toggleTag(this)"><input type="checkbox" name="traits" data-type="soc" data-text="但在面對團隊協作時目前較習慣獨立作業，在溝通分工的磨合期中，仍需要多投注一些耐心與他人同步" value="有時傾向於獨立完成任務，在小組協作與溝通分工的磨合期需要多一些耐心引導"> 👥 小組協作磨合期</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="customInput">補充個別化具體軼事或亮眼表現（⚠️ 這是區分學生個別特色的核心，建議具體填寫）：</label>
            <textarea id="customInput" style="height: 65px;" placeholder="例如：在參與牛欄河畔文史走讀時，自發記錄了水圳生態的變遷；或：在進行蘭花螳螂擬態研究時，冷靜修正了三次光源實驗設計..."></textarea>
        </div>

        <button class="btn" onclick="generateOutputAll()">✨ 依據目前組合動態生成「專屬 AI 提示詞」與「無套版評語草稿」</button>
    </div>

    <div class="card result-section" id="outputCard" style="display: none;">
        <h2><span>📋 智能動態整合輸出面板</span></h2>
        
        <div class="form-group">
            <label style="color: #924040;">🔥 頂級大型模型 (Gemini) 高級客製化提示詞（已強制進行區分度約束）：</label>
            <button class="copy-btn" onclick="copyText('promptBox')">複製高級提示詞</button>
            <div class="result-box" id="promptBox" style="background-color: #f9fbf9; border-color: #df9f9f; font-family: monospace; font-size: 13px;"></div>
        </div>

        <div class="form-group" style="margin-top: 25px;">
            <label style="color: var(--primary-color);">🌸 本機即時動態編織模擬評語（無固定套版，僅作離線快速草稿參考）：</label>
            <button class="copy-btn" onclick="copyText('commentBox')">複製模擬評語</button>
            <div class="result-box" id="commentBox"></div>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        renderLogTable();
        if(!localStorage.getItem('styleLogs')) {
            const initialLogs = [
                { time: "系統預置分析", snippet: "在獨立研究探討生命史過程中，展現極強觀察力...面對數據不符預期時顯得有些急躁...", feature: "細緻記錄歷程、關注情意盲點調適、避免死板對仗句型" }
            ];
            localStorage.setItem('styleLogs', JSON.stringify(initialLogs));
            renderLogTable();
        }
    };

    function toggleTag(labelElement) {
        setTimeout(() => {
            const cb = labelElement.querySelector('input');
            if(cb.checked) {
                labelElement.classList.add('active');
            } else {
                labelElement.classList.remove('active');
            }
        }, 50);
    }

    function analyzeAndLogStyle() {
        const text = document.getElementById('historyInput').value.trim();
        if (!text) { alert('請先輸入過去寫過的評語片段！'); return; }

        let features = ["語調溫暖自然"];
        if (text.includes("觀察") || text.includes("細")) features.push("重視細微觀察");
        if (text.includes("急") || text.includes("挫折") || text.includes("完美")) features.push("深度著墨情意韌性調適");
        if (text.includes("同儕") || text.includes("互評") || text.includes("小組")) features.push("高度關注社會互動與領導力");

        const newLog = {
            time: new Date().toLocaleString(),
            snippet: text.substring(0, 45) + (text.length > 45 ? "..." : ""),
            feature: features.join('、')
        };

        let currentLogs = JSON.parse(localStorage.getItem('styleLogs') || '[]');
        currentLogs.unshift(newLog);
        localStorage.setItem('styleLogs', JSON.stringify(currentLogs));
        
        renderLogTable();
        document.getElementById('historyInput').value = "";
        alert('全新寫作特徵已成功匯入本地後台資料庫！');
    }

    function renderLogTable() {
        const logs = JSON.parse(localStorage.getItem('styleLogs') || '[]');
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = "";
        logs.forEach(log => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${log.time}</td><td style="color:#555;">${log.snippet}</td><td style="font-weight:bold; color:var(--primary-color);">${log.feature}</td>`;
            tbody.appendChild(row);
        });
    }

    function generateOutputAll() {
        const name = document.getElementById('studName').value.trim() || '該生';
        const grade = document.getElementById('studGrade').value;
        const syllabus = document.getElementById('syllabusInput').value.trim() || '資優班專題探究課程';
        const custom = document.getElementById('customInput').value.trim();

        let constraints = [];
        if (document.getElementById('p_style').checked) constraints.push(document.getElementById('p_style').value);
        if (document.getElementById('p_tone').checked) constraints.push(document.getElementById('p_tone').value);
        if (document.getElementById('p_focus').checked) constraints.push(document.getElementById('p_focus').value);

        let selectedTraitsTexts = [];
        let cogTexts = [];
        let adjTexts = [];
        let socTexts = [];

        document.querySelectorAll('input[name="traits"]:checked').forEach(cb => {
            selectedTraitsTexts.push(cb.value);
            const dText = cb.getAttribute('data-text');
            const dType = cb.getAttribute('data-type');
            if (dType === 'cog') cogTexts.push(dText);
            if (dType === 'adj') adjTexts.push(dText);
            if (dType === 'soc') socTexts.push(dText);
        });

        const logs = JSON.parse(localStorage.getItem('styleLogs') || '[]');
        let historicalFeatures = logs.map(l => l.feature).join('、');
        if(!historicalFeatures) historicalFeatures = "溫暖自然、著重歷程與非認知盲點調適、禁用死板對仗式排比句。";

        // ==================== 1. 深度客製化的大模型 PROMPT ====================
        const finalPrompt = `你現在是一名專業的臺灣國民小學資優班導師，請依照我提供的個別特質組合，為【${grade}】的資優學生【${name}】撰寫具有強烈「區分度與畫面感」的學期成績單質性評語。

【重要生成鐵律】
1. 必須打破任何模版感，嚴格禁止套用標準格式。每一位學生的評語應該根據其特質與軼事展現出完全不同的敘事流動。
2. ${constraints.join('\n2. ')}

【本學期課程脈絡】
${syllabus}

【教師筆調特徵】
請融入並維持以下教學觀察溫度：${historicalFeatures}。

【該生本學期精確特質與課堂行為樣貌描述】
- 認知思考特徵：${cogTexts.length > 0 ? cogTexts.join('；') : '在既有步調中穩定跟隨。'}
- 盲點或情意調適：${adjTexts.length > 0 ? adjTexts.join('；') : '目前未出現顯著的情意波動，整體表現穩健。'}
- 團隊互動與領導力：${socTexts.length > 0 ? socTexts.join('；') : '在小組中能順應團體分工。'}
- 課堂核心具體軼事紀錄（務必將此具體事件作為評語的核心畫面，深入發揮，切勿敷衍帶過）：${custom ? custom : '無特定特殊軼事，但在專題各階段皆能踏實參與。'}

任務：請綜合上述完全獨特的特質與事件，直接為【${name}】量身編織一段約 150 至 250 字、行文流暢自然且充滿洞察力的質性評語。不需要產出任何前導詞。`;

        document.getElementById('promptBox').innerText = finalPrompt;


        // ==================== 2. 全動態無模版網頁模擬生成 ====================
        let generatedPieces = [];
        
        // 開頭片語：根據年級與是否有認知特質進行動態第一句
        if (grade === '三年級' || grade === '四年級') {
            if(cogTexts.length > 0) {
                generatedPieces.push(`本學期在專題課堂中，可以明顯看見${name}身上那份璀璨的資優潛質。`);
            } else {
                generatedPieces.push(`這學期隨著專題探究的步步推進，${name}逐漸摸索出屬於自己的學習節奏。`);
            }
        } else { // 高年級
            if(cogTexts.length > 0) {
                generatedPieces.push(`隨著專題研究進入深化階段，這學期充分見證了${name}在思維層次與文獻統整上的抽長。`);
            } else {
                generatedPieces.push(`這學期面對獨立研究與主題探究，${name}展現了高年級孩子應有的沉穩與踏實。`);
            }
        }

        // 揉合認知特質
        if(cogTexts.length > 0) {
            generatedPieces.push(`${name}${cogTexts.join('，同時')建構出相當有深度的探究基礎。}`);
        }

        // 揉合具體軼事（放到中間作為核心亮點，創造強烈的畫面區分）
        if(custom) {
            generatedPieces.push(`這份特質在日常課堂中展露無遺，特別是他在「${custom}」的過程中，更讓老師看到他獨特且深刻的思考切入點。`);
        }

        // 揉合非認知情意與調適
        if(adjTexts.length > 0) {
            generatedPieces.push(`不過，資優學習的旅程往往伴隨著心態的鍛鍊，老師觀察到${name}${adjTexts.join('，亦或是')}`);
            generatedPieces.push(`但在引導他重新梳理、放緩步調後，他也逐漸學會了如何面對未知與不確定性，這份在情意與韌性上的自我調適，是本學期最為珍貴的隱性成長。`);
        }

        // 揉合社會互動
        if(socTexts.length > 0) {
            generatedPieces.push(`在班級探究社群的互動中，${name}${socTexts.join('，並且')}`);
        }

        // 結尾
        generatedPieces.push(`期待未來他能持續帶著這份對世界的好奇心，在熱愛的領域中自在而踏實地閃耀。`);

        // 將所有片段拼接，並修正語氣銜接字詞
        let fullComment = generatedPieces.join(' ');
        
        // 清理一下可能重複的字詞
        fullComment = fullComment.replace(/\}|\{/g, '')
                                  .replace(/，建構出/g, '，進而建構出')
                                  .replace(/，並且 /g, '，這對小組合作有著極佳的穩定力量。');

        document.getElementById('commentBox').innerText = fullComment;
        document.getElementById('outputCard').style.display = 'block';
        document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => { alert('已成功複製到剪貼簿！'); })
        .catch(() => { alert('複製失敗，請手動選取文字。'); });
    }
</script>

</body>
</html>
