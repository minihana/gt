<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資優班成績單質性評語產生器 v6</title>
    <style>
        :root {
            --primary-color: #5b7065;
            --secondary-color: #c9d6cd;
            --accent-color: #df9f9f;
            --bg-color: #f7f9f8;
            --card-bg: #ffffff;
            --text-color: #3a4740;
            --border-color: #e2e8e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), #7a8f83);
            color: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 16px;
            color: var(--primary-color);
            margin-bottom: 16px;
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5750;
        }

        .trait-category {
            margin-bottom: 15px;
            border-bottom: 1px dashed #e2e8e5;
            padding-bottom: 12px;
        }

        .category-title {
            font-size: 13px;
            color: #72857a;
            font-weight: bold;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafbfa;
            color: var(--text-color);
            font-size: 14px;
            resize: vertical;
        }

        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .input-cell {
            flex: 1;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafbfa;
            font-size: 14px;
            color: var(--text-color);
        }

        .characteristic-tags {
            margin-top: 5px;
        }

        .tag-checkbox {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 8px;
            font-size: 12.5px;
            background: #f0f2f1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
        }

        .tag-checkbox input {
            margin-right: 5px;
        }

        .tag-checkbox.active {
            background-color: #e3ece8;
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #4a5c53;
        }

        .btn-blue {
            background-color: #5b7987;
            margin-top: 12px;
        }
        .btn-blue:hover {
            background-color: #465f6b;
        }

        .btn-secondary {
            background-color: #7a8f83;
            margin-top: 8px;
        }

        .result-section {
            background-color: #f4f7f5;
            border: 2px dashed var(--primary-color);
        }

        .result-box {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 12px;
            font-size: 14.5px;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #2e3b33;
            max-height: 500px;
            overflow-y: auto;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }

        .log-table th, .log-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .log-table th {
            background-color: #eef2f0;
            color: var(--primary-color);
            text-align: left;
        }

        .copy-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 5px 12px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }

        .copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .step-num {
            display: inline-block;
            width: 22px;
            height: 22px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 12px;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>資優班成績單評語優化產生器 v6 (究極字詞不重複版) 🌸</h1>
        <p>已完全移除 Prompt 欄位！專注提供四套全異詞組描述，支援多層次文學筆調無限疊加</p>
    </header>

    <div class="card">
        <h2><span class="step-num">1</span>步驟一：歷史評語風格庫分析</h2>
        <div class="form-group">
            <label for="historyInput">貼上您過去親自撰寫的評語範例（可持續累積）：</label>
            <textarea id="historyInput" placeholder="在此貼上您以前寫的個別化評語，系統會自動在本地瀏覽器後台分析並留存您的語調特徵..."></textarea>
            <button class="btn btn-secondary" style="width: auto; padding: 6px 16px; font-size: 13px;" onclick="analyzeAndLogStyle()">📥 分析語調風格並記錄至後台</button>
        </div>
        <div>
            <label>📊 本地後台已儲存的筆調特徵：</label>
            <div style="overflow-x: auto;">
                <table class="log-table" id="logTable">
                    <thead>
                        <tr>
                            <th style="width: 20%;">分析時間</th>
                            <th style="width: 50%;">原評語片段摘要</th>
                            <th style="width: 30%;">系統提取之筆調特徵</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card">
        <h2><span class="step-num">2</span>步驟二：選填學生基本資料與資優特質表現</h2>
        
        <div class="input-row">
            <div class="input-cell">
                <label for="studName">學生姓名</label>
                <input type="text" id="studName" placeholder="例如：小薰">
            </div>
            <div class="input-cell">
                <label for="studGrade">年級</label>
                <select id="studGrade">
                    <option value="三年級">三年級</option>
                    <option value="四年級">四年級</option>
                    <option value="五年級">五年級</option>
                    <option value="六年級">六年級</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>🧬 國小資優生課堂學習表現樣貌（請勾選孩子符合的項目）：</label>
            
            <div class="trait-category">
                <div class="category-title">💡 認知思考與探究特質</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_observe"> 🔍 觀察敏銳細緻</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_research"> 🚀 獨立自主探究</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_connect"> 🧩 跨領域聯結力強</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_desire"> 🎯 強烈內在求知欲</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_creative"> 💡 創意思維擴散</label>
                </div>
            </div>

            <div class="trait-category">
                <div class="category-title">⚖️ 學習歷程與盲點調適（情意/非認知層面）</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="adj_perfect"> ⚠️ 挫折容忍度待引導</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="adj_write"> ✍️ 文字收尾深度待提煉</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="adj_detail"> 🎯 過度執著於細節</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="adj_bored"> 🥱 缺乏挑戰時易渙散</label>
                </div>
            </div>

            <div class="trait-category">
                <div class="category-title">🤝 領導力、情意特質與同儕互動</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="soc" value="soc_review"> 💬 善於建設性互評</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="soc" value="soc_leader"> 👑 小組正向引領領導</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="soc" value="soc_empathy"> 🌱 具高度人文生態同理</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="soc" value="soc_alone"> 👥 小組協作磨合期</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="customInput">補充個別化具體軼事紀錄（將融為散文核心畫面）：</label>
            <textarea id="customInput" style="height: 65px;" placeholder="例如：在參與牛欄河畔文史走讀時，自發記錄了水圳生態的變遷..."></textarea>
        </div>

        <button class="btn" onclick="generateCommentSystem(false)">✨ 依據目前組合動態生成「第一段精緻評語」</button>
        <button class="btn btn-blue" onclick="generateCommentSystem(true)">➕ 疊加另一種全新描述語句（用詞全異，保留前段往下追加）</button>
    </div>

    <div class="card result-section" id="outputCard" style="display: none;">
        <h2><span>🌸 專屬客製化質性評語庫（已完全排除生硬死板對仗）</span>
            <button class="copy-btn" onclick="copyText('commentBox')">複製全部文字</button>
        </h2>
        <div class="result-box" id="commentBox"></div>
    </div>
</div>

<script>

        },
        
        // --- 意境二：內斂微觀體 ---

            open: "隨著本季主題研究的步步深化，[NAME]在心智運作上的抽長有目共睹。",
            cog_observe: "其視角極為細密，能自發覺察旁人往往忽略的幽微細節與底層質地",
            cog_research: "遭逢瓶頸時他不急不躁，多能沉靜地翻閱典籍、操作工具來抽絲剝繭",

            adj_perfect: "只是對自我要求甚高，當進度或結果出現波動，神情間難免泛起一絲挫折與緊繃",
            adj_write: "手腳俐落、實踐力極強，惟期末將思考歷程轉化為文字時，收尾語調顯得稍有力道未竟之感",
            adj_detail: "沉浸於專題時極具匠心，但有時會過於膠著於局部
