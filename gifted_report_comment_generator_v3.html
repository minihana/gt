<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資優班成績單質性評語產生器 v7</title>
    <style>
        :root {
            --primary-color: #5b7065;
            --secondary-color: #c9d6cd;
            --accent-color: #df9f9f;
            --bg-color: #f7f9f8;
            --card-bg: #ffffff;
            --text-color: #3a4740;
            --border-color: #e2e8e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), #7a8f83);
            color: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 16px;
            color: var(--primary-color);
            margin-bottom: 16px;
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5750;
        }

        .trait-category {
            margin-bottom: 15px;
            border-bottom: 1px dashed #e2e8e5;
            padding-bottom: 12px;
        }

        .category-title {
            font-size: 13px;
            color: #72857a;
            font-weight: bold;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafbfa;
            color: var(--text-color);
            font-size: 14px;
            resize: vertical;
        }

        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .input-cell {
            flex: 1;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafbfa;
            font-size: 14px;
            color: var(--text-color);
        }

        .characteristic-tags {
            margin-top: 5px;
        }

        .tag-checkbox {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 8px;
            font-size: 12.5px;
            background: #f0f2f1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
        }

        .tag-checkbox input {
            margin-right: 5px;
        }

        .tag-checkbox.active {
            background-color: #e3ece8;
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #4a5c53;
        }

        .btn-blue {
            background-color: #5b7987;
            margin-top: 12px;
        }
        .btn-blue:hover {
            background-color: #465f6b;
        }

        .btn-secondary {
            background-color: #7a8f83;
            margin-top: 8px;
        }

        .result-section {
            background-color: #f4f7f5;
            border: 2px dashed var(--primary-color);
        }

        .result-box {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 12px;
            font-size: 14.5px;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #2e3b33;
            max-height: 500px;
            overflow-y: auto;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }

        .log-table th, .log-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
        }

        .log-table th {
            background-color: #eef2f0;
            color: var(--primary-color);
            text-align: left;
        }

        .copy-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 5px 12px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }

        .copy-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .step-num {
            display: inline-block;
            width: 22px;
            height: 22px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 12px;
            margin-right: 8px;
        }

</head>
<body>

<div class="container">
    <header>
        <h1>資優班成績單評語優化產生器 v7 (特徵系統同步連動版) 🌸</h1>
        <p>全新加入「自訂筆調特徵欄位」，後台分析按鈕全面修復，與生成描述達到系統級深度聯連動！</p>
    </header>

    <div class="card">
        <h2><span class="step-num">1</span>步驟一：歷史評語分析與筆調風格設定</h2>
        
        <div class="form-group" style="background-color: #fcfdfe; border: 1px dashed var(--secondary-color); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <label for="currentStyleInput" style="color: #924040; font-size: 15px;">✍️ 目前啟用的筆調特徵風格（⚠️ 此欄位直接連結影響下方評語產出）：</label>
            <input type="text" id="currentStyleInput" placeholder="例如：筆調自然溫暖、側重微觀覺察、融入情意韌性（可自行輸入修改，或由下方按鈕自動提取）" value="筆調自然溫暖、側重微觀覺察、融入情意韌性">
        </div>

        <div class="form-group">
            <label for="historyInput">從過去親自撰寫的評語片段中自動提取風格（選填）：</label>
            <textarea id="historyInput" placeholder="在此貼上您以前寫的個別化評語，系統會自動分析出筆調特色，並直接覆蓋更新到上方的特徵欄位中..."></textarea>
            <button class="btn btn-secondary" style="width: auto; padding: 6px 16px; font-size: 13px;" onclick="analyzeAndLogStyle()">📥 執行風格分析並同步至特徵欄位</button>
        </div>
        <div>
            <label>📊 本地後台分析歷史紀錄：</label>
            <div style="overflow-x: auto;">
                <table class="log-table" id="logTable">
                    <thead>
                        <tr>
                            <th style="width: 20%;">分析時間</th>
                            <th style="width: 50%;">原評語片段摘要</th>
                            <th style="width: 30%;">系統提取之筆調特徵</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card">
        <h2><span class="step-num">2</span>步驟二：選填學生基本資料與資優特質表現</h2>
        
        <div class="input-row">
            <div class="input-cell">
                <label for="studName">學生姓名</label>
                <input type="text" id="studName" placeholder="例如：小薰">
            </div>
            <div class="input-cell">
                <label for="studGrade">年級</label>
                <select id="studGrade">
                    <option value="三年級">三年級</option>
                    <option value="四年級">四年級</option>
                    <option value="五年級">五年級</option>
                    <option value="六年級">六年級</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label>🧬 國小資優生課堂學習表現樣貌（請勾選孩子符合的項目）：</label>
            
            <div class="trait-category">
                <div class="category-title">💡 認知思考與探究特質</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_observe"> 🔍 觀察敏銳細緻</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_research"> 🚀 獨立自主探究</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_connect"> 🧩 跨領域聯結力強</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_desire"> 🎯 強烈內在求知欲</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="cog_creative"> 💡 創意思維擴散</label>
                </div>
            </div>

            <div class="trait-category">
                <div class="category-title">⚖️ 學習歷程與盲點調適（情意/非認知層面）</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="adj_perfect"> ⚠️ 挫折容忍度待引導</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="adj_write"> ✍️ 文字收尾深度待提煉</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="adj_detail"> 🎯 過度執著於細節</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="adj_bored"> 🥱 缺乏挑戰時易渙散</label>
                </div>
            </div>

            <div class="trait-category">
                <div class="category-title">🤝 領導力、情意特質與同儕互動</div>
                <div class="characteristic-tags">
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="soc_review"> 💬 善於建設性互評</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="soc_leader"> 👑 小組正向引領領導</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="soc_empathy"> 🌱 具高度人文生態同理</label>
                    <label class="tag-checkbox"><input type="checkbox" name="traits" value="soc_alone"> 👥 小組協作磨合期</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="customInput">補充個別化具體軼事紀錄（將融為散文核心畫面）：</label>
            <textarea id="customInput" style="height: 65px;" placeholder="例如：在參與牛欄河畔文史走讀時，自發記錄了水圳生態的變遷..."></textarea>
        </div>

        <button class="btn" onclick="generateCommentSystem(false)">✨ 依據目前組合動態生成「第一段精緻評語」</button>
        <button class="btn btn-blue" onclick="generateCommentSystem(true)">➕ 疊加另一種全新描述語句（用詞全異，保留前段往下追加）</button>
    </div>

    <div class="card result-section" id="outputCard" style="display: none;">
        <h2><span>🌸 專屬客製化質性評語庫（依據自訂筆調特徵精準揉合）</span>
            <button class="copy-btn" onclick="copyText('commentBox')">複製全部文字</button>
        </h2>
        <div class="result-box" id="commentBox"></div>
    </div>
</div>

            adj_write: "實作進度永遠超前，但期末成果報告的文字鋪陳與收尾力度，仍有些許提煉的空間",
            adj_detail: "極具鑽研精神，但也偶爾會陷入特定細部的泥淖，需要旁人適時拉高其視野",
            adj_bored: "對常規的抄寫或講授反應較平淡，唯有在高度考驗腦力的複雜情境中，才能全然喚醒其專注力",
            
            soc_review: "與夥伴互動時極具氣度，樂於用溫暖的對話與極具洞察力的觀點，共創課堂討論深度",
            soc_leader: "深具領導風範，能悉心傾聽並接納組員的多樣聲音，使小組探究任務得以精采呈現",
            soc_empathy: "心思柔軟且生命情懷濃郁，面對生態永續或文史變遷等議題，能展現深刻的人文反思",
            soc_alone: "不過有時他較習慣關在自己的世界裡耕耘，如何敞開心胸進行更深度的團隊協作，仍需多加提振",
            close: "盼望他持續淬鍊這份探究底蘊，在漫長的人生學習地圖中，沉穩而自信地閃耀。"
        }
    };

    let clickCount = 0;

    document.addEventListener('change', function(e) {
        if (e.target && e.target.name === 'traits') {
            const label = e.target.closest('.tag-checkbox');
            if (label) {
                if (e.target.checked) label.classList.add('active');
                else label.classList.remove('active');
            }
        }
    });

    window.onload = function() { renderLogTable(); };

    // 🔥 全面修復分析按鈕：提取特徵並同步至上方特徵輸入框
    function analyzeAndLogStyle() {
        const text = document.getElementById('historyInput').value.trim();
        if (!text) { alert('請先輸入過去寫過的評語片段！'); return; }

        let features = ["筆調自然溫暖"];
        if (text.includes("觀察") || text.includes("細") || text.includes("捕捉")) features.push("側重微觀覺察");
        if (text.includes("急") || text.includes("挫折") || text.includes("完美") || text.includes("心態")) features.push("融入情意韌性");
        if (text.includes("小組") || text.includes("同儕") || text.includes("互動") || text.includes("凝聚")) features.push("著眼共學群體");

        const finalStyleString = features.join('、');

        // 1. 同步覆蓋上方的特徵輸入框
        document.getElementById('currentStyleInput').value = finalStyleString;

        // 2. 寫入本地歷史紀錄
        const newLog = {
            time: new Date().toLocaleTimeString(),
            snippet: text.substring(0, 45) + (text.length > 45 ? "..." : ""),
            feature: finalStyleString
        };

        let currentLogs = JSON.parse(localStorage.getItem('styleLogs') || '[]');
        currentLogs.unshift(newLog);
        localStorage.setItem('styleLogs', JSON.stringify(currentLogs));
        
        renderLogTable();
        document.getElementById('historyInput').value = "";
        alert('✨ 風格提取成功！已自動同步連動至上方的「筆調特徵風格欄位」！');
    }

    function renderLogTable() {
        const tbody = document.getElementById('logTableBody');
        if (!tbody) return;
        let logs = JSON.parse(localStorage.getItem('styleLogs') || '[]');
        if (logs.length === 0) {
            logs = [{ time: "系統預置", snippet: "範例：展現極強觀察力...面對數據不符預期時顯得有些急躁...", feature: "筆調自然溫暖、側重微觀覺察、融入情意韌性" }];
            localStorage.setItem('styleLogs', JSON.stringify(logs));
        }
        tbody.innerHTML = "";
        logs.forEach(log => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${log.time}</td><td style="color:#555;">${log.snippet}</td><td style="font-weight:bold; color:var(--primary-color);">${log.feature}</td>`;
            tbody.appendChild(row);
        });
    }

    // 🔥 系統性連動生成邏輯
    function generateCommentSystem(isAppendMode) {
        const name = document.getElementById('studName').value.trim() || '該生';
        const custom = document.getElementById('customInput').value.trim();
        
        // 抓取自訂風格欄位的內容進行系統性融入
        const userStyle = document.getElementById('currentStyleInput').value.trim() || "筆調自然溫暖";

        if (!isAppendMode) {
            clickCount = 1;
            document.getElementById('commentBox').innerText = "";
        } else {
            clickCount++;
            if (clickCount > 4) {
                alert('已為您疊加至第四套極致意境！如需重新洗牌，請點擊第一個按鈕。');
                clickCount = 4;
                return;
            }
        }

        const currentSet = DICTIONARY['set' + clickCount];
        let pieces = [];

        // 1. 根據使用者輸入的風格，動態修飾開頭修辭（系統性連動機制）
        let dynamicOpen = currentSet.open.replace(/\[NAME\]/g, name);
        if (userStyle.includes("微觀") || userStyle.includes("觀察")) {
            dynamicOpen = dynamicOpen.replace("學習質地", "且絲絲入扣的微觀學習質地");
        }
        if (userStyle.includes("溫暖") || userStyle.includes("情意")) {
            dynamicOpen = "🌸 " + dynamicOpen;
        }
        pieces.push(dynamicOpen);

        // 2. 勾選特質注入
        document.querySelectorAll('input[name="traits"]:checked').forEach(cb => {
            const key = cb.value;
            if (currentSet[key]) {
                pieces.push(currentSet[key]);
            }
        });

        // 3. 具體軼事融入
        if (custom) {
            if (clickCount === 1) pieces.push(`這份特質在日常課堂中展露無遺，特別是他在「${custom}」的過程中，更讓老師看到他特定且深刻的思考切入點。`);
            if (clickCount === 2) pieces.push(`回溯其具體足跡，尤其是當他全心投入於「${custom}」時，那種沉浸且熱切的眼神令人印象深刻。`);
            if (clickCount === 3) pieces.push(`這番獨特視角，在課堂歷程提及「${custom}」那一刻格外清晰，展現了極佳的心智韌性。`);
            if (clickCount === 4) pieces.push(`尤其是在深入探討「${custom}」這段歷程時，其細緻的處理手法更凸顯了超齡的研究底蘊。`);
        }

        // 4. 結尾：將使用者的風格關鍵字直接內嵌整合至文末（深度連結）
        let dynamicClose = currentSet.close;
        if (userStyle) {
            dynamicClose = dynamicClose.replace("踏實邁進", `帶著「${userStyle}」的獨特步調踏實邁進`);
            dynamicClose = dynamicClose.replace("安穩前行", `秉持「${userStyle}」的初衷安穩前行`);
        }
        pieces.push(dynamicClose);

        // 標點與換行編排
        let paragraph = pieces.join('，') + '。';
        paragraph = paragraph.replace(/。，/g, '。')
                             .replace(/，，/g, '，')
                             .replace(/，。/g, '。')
                             .replace(/。/g, '。  \n\n');

        const box = document.getElementById('commentBox');
        if (!isAppendMode) {
            box.innerText = paragraph;
        } else {
            box.innerText = box.innerText + "\n\n" + paragraph;
        }

        document.getElementById('outputCard').style.display = 'block';
        document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => { alert('已成功複製完整評語到剪貼簿！'); })
        .catch(() => { alert('複製失敗，請手動選取文字。'); });
    }
</script>
