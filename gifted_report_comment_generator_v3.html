<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資優班質性評語優化器 v9</title>
    <style>
        :root {
            --primary-color: #5c7265;
            --secondary-color: #d1ddd5;
            --accent-color: #d08c8c;
            --bg-color: #f8faf9;
            --card-bg: #ffffff;
            --text-color: #3b4540;
            --border-color: #e0e8e4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.7; padding: 30px 20px; }
        .container { max-width: 1050px; margin: 0 auto; }

        header {
            text-align: center; margin-bottom: 30px;
            background: linear-gradient(135deg, var(--primary-color), #7a9184);
            color: white; padding: 28px; border-radius: 18px;
            box-shadow: 0 6px 20px rgba(92, 114, 101, 0.15);
        }
        header h1 { font-size: 24px; margin-bottom: 8px; font-weight: 600; }
        header p { font-size: 14.5px; opacity: 0.95; }

        .card {
            background: var(--card-bg); border-radius: 14px; padding: 26px; margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
        }
        .card h2 { font-size: 16.5px; color: var(--primary-color); margin-bottom: 18px; display: flex; align-items: center; }
        
        .step-num {
            display: inline-block; width: 24px; height: 24px; background-color: var(--primary-color);
            color: white; border-radius: 50%; text-align: center; line-height: 24px; font-size: 13px; margin-right: 10px;
        }
